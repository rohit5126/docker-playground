name: devsecops-pipeline
on:
  workflow_dispatch:  
jobs:
  frontend-code-quality:
    uses: ./.github/workflows/Node-code-quality.yml
    with:
      node-version: 20
      package-path: frontend/package-lock.json
      code-path: frontend/
  backend-code-quality:
    uses: ./.github/workflows/Go-code-quality.yml
    with:
      go-version: '1.23'
      go-version-file: backend/go.mod
      cache-dependency-path: backend/go.sum
      code-path: backend/
  secret-scanner:
    uses: ./.github/workflows/secret-scanning.yml

  dependency-check:
    uses: ./.github/workflows/security-check.yml
    with:
      backend_workdir: backend
      frontend_workdir: frontend

  docker-lint-scan:
    needs: [ dependency-check,secret-scanner, backend-code-quality, frontend-code-quality ]
    uses: ./.github/workflows/docker-lint.yml
    with:
      frontend-dockerfile-dir: frontend
      backend-dockerfile-dir: backend
    secrets: 
      docker_username: ${{ vars.DOCKER_USER }}
      docker_password: ${{ secrets.DOCKER_TOKEN }}
      
  docker-Sonar-Scan:
    needs: [docker-lint-scan]
    uses: ./.github/workflows/Sonarcube.yml
    with:
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
    secrets: 
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      
  push-to-docker-Hub:
    needs: [docker-Sonar-Scan]
    uses: ./.github/workflows/docker-push.yml
    with:
      frontend-dockerfile-dir: frontend
      backend-dockerfile-dir: backend
    secrets: 
      docker_username: ${{ vars.DOCKER_USER }}
      docker_password: ${{ secrets.DOCKER_TOKEN }}

## ______Deploy- CD______

  deploy-app:
    needs: [push-to-docker-Hub]
    uses: ./.github/workflows/deploy.yml
    secrets: inherit

  
      
  
